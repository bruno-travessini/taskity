name: CI - Verificacoes Taskify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    name: Testes e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Validar sintaxe do servidor e rotas
        run: |
          node --check src/server.js
          node --check src/router.js
      - name: Executar testes Vitest
        run: npm run test:run
      - name: Verificar dependencias de producao
        run: npm audit --omit=dev --audit-level=high
